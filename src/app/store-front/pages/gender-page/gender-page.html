
<h1 class="text-3xl font-bold">
  Todos los productos de
  <span class="text-accent">{{ gender() }}</span>
</h1>
<h2 class="text-xl mb-5">Para el gusto</h2>

<div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 mt-2 gap-3">

  @for (product of productsResource.value()?.products; track product.id)
  {
    <product-card
      [product]=" product "
    />
  }
  @empty {
    <p> No hay productos </p>
  }

</div>

<app-pagination
  [pages]=" productsResource.value()?.pages ?? 0 "
  [currentPage]=" paginationService.currentPage() "
/>
