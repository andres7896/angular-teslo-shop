<label
  class="swap swap-rotate btn btn-ghost btn-circle"
  [attr.aria-label]="themeStore.isDark() ? 'Activar modo claro' : 'Activar modo oscuro'">
  <input
    type="checkbox"
    [checked]="themeStore.isDark()"
    (change)="themeStore.toggle()"
  />

  <!-- Sol: visible en modo claro -->
  <svg class="swap-off h-5 w-5 fill-current" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
    <path d="M5.64 17l-.71.71a1 1 0 0 0 0 1.41 1 1 0 0 0 1.41 0l.71-.71A1 1 0 0 0 5.64 17ZM5 12a1 1 0 0 0-1-1H3a1 1 0 0 0 0 2h1A1 1 0 0 0 5 12Zm7-7a1 1 0 0 0 1-1V3a1 1 0 0 0-2 0V4A1 1 0 0 0 12 5ZM5.64 7.05a1 1 0 0 0 .7.29 1 1 0 0 0 .71-.29 1 1 0 0 0 0-1.41l-.71-.71a1 1 0 0 0-1.41 1.41Zm12 .29a1 1 0 0 0 .7-.29l.71-.71a1 1 0 1 0-1.41-1.41L17 5.64a1 1 0 0 0 0 1.41A1 1 0 0 0 17.66 7.34ZM21 11H20a1 1 0 0 0 0 2h1a1 1 0 0 0 0-2Zm-2.64 6A1 1 0 0 0 17 18.36l.71.71a1 1 0 0 0 1.41 0 1 1 0 0 0 0-1.41ZM12 19a1 1 0 0 0-1 1v1a1 1 0 0 0 2 0V20A1 1 0 0 0 12 19Zm0-13a6 6 0 1 0 6 6A6 6 0 0 0 12 6Zm0 10a4 4 0 1 1 4-4A4 4 0 0 1 12 16Z" />
  </svg>

  <!-- Luna: visible en modo oscuro -->
  <svg class="swap-on h-5 w-5 fill-current" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
    <path d="M21.64 13a1 1 0 0 0-1.05-.14 8.05 8.05 0 0 1-3.37.73 8.15 8.15 0 0 1-8.14-8.1 8.59 8.59 0 0 1 .25-2A1 1 0 0 0 8 2.36a10.14 10.14 0 1 0 14 11.69 1 1 0 0 0-.36-1.05Zm-9.5 6.69A8.14 8.14 0 0 1 7.08 5.22v.27a10.15 10.15 0 0 0 10.14 10.14 9.79 9.79 0 0 0 2.1-.22 8.11 8.11 0 0 1-7.18 4.32Z" />
  </svg>
</label>
